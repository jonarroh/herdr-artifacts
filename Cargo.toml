[package]
name = "herdr-artifacts"
version = "0.1.0"
edition = "2024"
description = "Visual, interactive artifacts for Herdr agents, rendered natively in the terminal"
license = "MIT"
repository = "https://github.com/jonarroh/herdr-artifacts"

[lib]
name = "herdr_artifacts"
path = "src/lib.rs"

[[bin]]
name = "herdr-artifacts"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["osc52"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
interprocess = { version = "2.4", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.15", default-features = false, features = ["std"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
